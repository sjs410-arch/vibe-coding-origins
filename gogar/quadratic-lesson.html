<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#xADFC;&#xC758; &#xACF5;&#xC2DD; GoGAR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#fff;--bg2:#f5f4f0;--bg3:#eceae3;
--text:#1a1a1a;--text2:#555;--text3:#999;
--b:rgba(0,0,0,.12);--b2:rgba(0,0,0,.22);
--p0:#EEEDFE;--p1:#CECBF6;--p2:#534AB7;--p3:#26215C;
--t0:#E1F5EE;--t1:#9FE1CB;--t2:#0F6E56;--t3:#04342C;
--c0:#FAECE7;--c1:#F5C4B3;--c2:#993C1D;
--a0:#FAEEDA;--a1:#FAC775;--a2:#633806;
--r:8px;--rl:12px
}
@media(prefers-color-scheme:dark){
:root{
--bg:#1e1e1e;--bg2:#2a2a2a;--bg3:#333;
--text:#f0f0f0;--text2:#aaa;--text3:#666;
--b:rgba(255,255,255,.1);--b2:rgba(255,255,255,.22);
--p0:#26215C;--p1:#3C3489;--p2:#AFA9EC;--p3:#EEEDFE;
--t0:#04342C;--t1:#085041;--t2:#5DCAA5;--t3:#E1F5EE;
--c0:#4A1B0C;--c1:#712B13;--c2:#F0997B;
--a0:#412402;--a1:#633806;--a2:#FAC775
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:1.5rem}
.hdr h1{font-size:20px;font-weight:600}
.hdr p{font-size:13px;color:var(--text2);margin-top:5px;line-height:1.6}
.info{background:var(--p0);border:.5px solid var(--p1);border-radius:var(--r);padding:10px 14px;margin-bottom:1.25rem;font-size:13px;color:var(--p3);line-height:1.65}
.fbox{background:var(--bg);border:.5px solid var(--b);border-radius:var(--r);padding:11px 14px;margin-bottom:1.25rem;text-align:center;font-size:16px;font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;color:var(--text)}
.snav{display:flex;margin-bottom:1.25rem;justify-content:center;align-items:center}
.sdot{width:30px;height:30px;border-radius:50%;border:.5px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);background:var(--bg2);flex-shrink:0;transition:all .2s}
.sdot.cur{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.sdot.done{background:#0F6E56;color:#E1F5EE;border-color:#0F6E56;cursor:pointer}
.sline{width:22px;height:1px;background:var(--b2)}
.sbadge{font-size:12px;color:var(--text3);text-align:center;margin-bottom:.5rem}
.card{background:var(--bg);border:.5px solid var(--b);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:10px;margin-bottom:12px;font-weight:600}
.up{background:var(--p1);color:var(--p3)}
.dn{background:var(--t1);color:var(--t3)}
.ic{background:var(--c1);color:var(--c2)}
.en{background:var(--a1);color:var(--a2)}
.brow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.brow.r{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.av.t{background:var(--p1);color:var(--p3)}
.av.s{background:var(--t1);color:var(--t3)}
.bb{max-width:86%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.7}
.bb.t{background:var(--p0);color:var(--p3);border-top-left-radius:3px}
.bb.s{background:var(--t0);color:var(--t3);border-top-right-radius:3px}
.m{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;white-space:nowrap}
.ig{display:inline-flex;align-items:center;white-space:nowrap}
.lim{display:inline-flex;flex-direction:column;font-size:.68em;line-height:1.05;margin:0 2px 0 1px;text-align:left}
hr{border:none;border-top:.5px solid var(--b);margin:1rem 0}
.ql{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.65}
.clog{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm.me{flex-direction:row-reverse}
.cav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cav.ai{background:var(--p1);color:var(--p3)}
.cav.me{background:var(--t1);color:var(--t3)}
.cb{max-width:86%;padding:9px 13px;border-radius:11px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.cb.ai{background:var(--p0);color:var(--p3);border-top-left-radius:3px}
.cb.me{background:var(--t0);color:var(--t3);border-top-right-radius:3px}
.cb.ok{background:var(--t0);color:var(--t2);border:.5px solid var(--t1);border-top-left-radius:3px}
.cb.partial{background:var(--a0);color:var(--a2);border:.5px solid var(--a1);border-top-left-radius:3px}
.cb.miss{background:var(--c0);color:var(--c2);border:.5px solid var(--c1);border-top-left-radius:3px}
.cb.hint{background:var(--bg2);color:var(--text);border:.5px dashed var(--b2);border-top-left-radius:3px}
.cb.typing{color:var(--text3);background:var(--bg2)}
.phase{font-size:12px;color:var(--text3);margin:4px 0 8px}
textarea{width:100%;min-height:80px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);border:.5px solid var(--b2);border-radius:var(--r);padding:10px 13px;resize:vertical;line-height:1.6}
textarea:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 2px rgba(83,74,183,.12)}
.brow2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.kbd{font-size:11px;color:var(--text3);margin-left:auto}
.btn{border:.5px solid var(--b2);border-radius:var(--r);padding:9px 16px;font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.45;cursor:default}
.bp{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.bp:hover:not(:disabled){background:#3C3489}
.bs{background:var(--bg);color:var(--text)}
.bs:hover:not(:disabled){background:var(--bg2)}
.nrow{margin-top:.25rem;margin-bottom:1rem;display:none;justify-content:flex-end}
.nrow.show{display:flex}
.sum{background:var(--bg);border:.5px solid var(--b);border-radius:var(--rl);padding:1.5rem}
.sum h2{font-size:17px;font-weight:600;margin-bottom:1rem}
.ff{text-align:center;margin:1rem 0 1.25rem;padding:14px;background:var(--p0);border-radius:var(--r);font-size:17px;font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;color:var(--p3);border:.5px solid var(--p1);line-height:1.8}
.si{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.si .tag{flex-shrink:0;margin-bottom:0;min-width:96px;text-align:center}
.st{font-size:13.5px;line-height:1.7}
.note{margin-top:1rem;padding:12px 14px;background:var(--bg2);border-radius:var(--r);border:.5px solid var(--b);font-size:13px;color:var(--text2);line-height:1.7}
.again{margin-top:1rem;display:flex;justify-content:center}
@media(max-width:480px){.si{flex-direction:column;gap:4px}.bb,.cb{max-width:92%}}
</style>
</head>

info:"\uC218\uC5C5 \uBC29\uC2DD: T\uC758 \uC9C8\uBB38\uC5D0 \uC790\uC2E0\uC758 \uC0DD\uAC01\uC744 \uC4F0\uACE0 [\uC81C\uCD9C]\uC744 \uB204\uB974\uC138\uC694. \uD55C \uC9C8\uBB38 \uC548\uC5D0\uC11C \uC5EC\uB7EC \uBC88 \uB098\uB220 \uB2F5\uD574\uB3C4 \uC55E\uC5D0\uC11C \uC4F4 \uB0B4\uC6A9\uC744 \uAE30\uC5B5\uD558\uACE0 \uD568\uAED8 \uD310\uB2E8\uD574\uC694. \uB2F5\uC774 \uB9DE\uC73C\uBA74 T\uAC00 \uD55C \uAC78\uC74C \uB354 \uAE4A\uC740 \uC9C8\uBB38\uC744 \uB358\uC9C0\uACE0, \uB9C9\uD788\uBA74 [\uD78C\uD2B8 \uC694\uCCAD]\uC744 \uB204\uB974\uC138\uC694. \uD78C\uD2B8\uB294 '\uC791\uC740 \uC9C8\uBB38 \u2192 \uBE48\uCE78 \uCC44\uC6B0\uAE30 \u2192 \uC815\uB2F5 \uACF5\uAC1C' \uC21C\uC11C\uB85C \uC810\uC810 \uAD6C\uCCB4\uC801\uC73C\uB85C \uB098\uC624\uBA70, \uB450 \uBC88 \uC774\uC0C1 \uB9C9\uD788\uBA74 \uC790\uB3D9\uC73C\uB85C \uB2E4\uC74C \uD78C\uD2B8\uAC00 \uB098\uC635\uB2C8\uB2E4.",

 partial:{kw:["\uB098\uB204","\uAC04\uB2E8","\uC815\uB9AC","a\uB85C"],msg:"a\uB85C \uB098\uB208\uB2E4\uB294 \uAC74 \uB9DE\uC544\uC694. \uADF8\uB7F0\uB370 '\uAC04\uB2E8\uD574\uC9C0\uB2C8\uAE4C'\uBCF4\uB2E4 \uB354 \uBD84\uBA85\uD55C \uBAA9\uC801\uC774 \uC788\uC5B4\uC694. a\uB85C \uB098\uB204\uBA74 x\u00B2\uC758 \uACC4\uC218\uAC00 \uC5B4\uB5BB\uAC8C \uBCC0\uD558\uACE0, \uADF8\uAC8C (x + \u25CB)\u00B2 \uAF34\uC744 \uB9CC\uB4DC\uB294 \uB370 \uC65C \uD544\uC694\uD560\uAE4C\uC694?"},

"\uC608\uB97C \uB4E4\uC5B4 2x\u00B2 + 8x + 3 = 0 \uC744 (x + \u25CB)\u00B2 \uAF34\uB85C \uBC14\uAFB8\uB824 \uD560 \uB54C, x\u00B2 \uC55E\uC758 2\uAC00 \uAC78\uB9BC\uB3CC\uC774 \uB418\uC9C0 \uC54A\uB098\uC694? \uADF8 2\uB97C \uC5B4\uB5BB\uAC8C \uCC98\uB9AC\uD558\uBA74 \uB420\uAE4C\uC694?"],
hints:["\uC791\uC740 \uC9C8\uBB38 1: (x + p)\u00B2 \uC744 \uC804\uAC1C\uD558\uBA74 \uC5B4\uB5A4 \uC2DD\uC774 \uB418\uB098\uC694?",

var cur=0,done=[],logs=[],state=[],busy=false;
T.steps.forEach(function(){logs.push([]);state.push({phase:"main",hint:0,fail:0,acc:"",last:""});});

function fmt(s){
  return String(s)
    .replace(/\u222B\[([^,\]]+),([^\]]+)\]/g,'<span class="ig">\u222B<span class="lim"><span>$2</span><span>$1</span></span></span>');
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function norm(s){
  return String(s).toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[\u2032\u2019\u2018`]/g,"'")
    .replace(/[\u2212\u2013\u2014]/g,"-")
    .replace(/\u00B2/g,"^2").replace(/\u00B3/g,"^3").replace(/\u207F/g,"^n")
    .replace(/[\u00B7\u00D7]/g,"*")
    .replace(/\uFF1C/g,"<").replace(/\uFF1E/g,">").replace(/\uFF5C/g,"|");
}
function has(a,list){
  for(var i=0;i<list.length;i++){if(a.indexOf(norm(list[i]))>=0)return true;}
  return false;
}
function judge(ans,spec){
  var a=norm(ans);
  var hit=spec.groups.map(function(g){return has(a,g.kw);});
  var n=hit.filter(Boolean).length;
  if(n>=spec.need)return{lv:"good"};
  if(n>0){
    for(var i=0;i<hit.length;i++){if(!hit[i]&&spec.groups[i].lack)return{lv:"partial",msg:spec.groups[i].lack};}
  }
  if(spec.partial&&has(a,spec.partial.kw))return{lv:"partial",msg:spec.partial.msg};
  return{lv:"miss"};
}

document.getElementById("title").textContent=T.title;
document.getElementById("subtitle").textContent=T.subtitle;
document.getElementById("info").textContent=T.info;

function renderNav(){
  document.getElementById("snav").innerHTML=T.steps.map(function(s,i){
    var cl=i===cur?"cur":(done.indexOf(i)>=0?"done":"");
    return '<div class="sdot '+cl+'" data-i="'+i+'">'+(i+1)+'</div>'+(i<T.steps.length-1?'<div class="sline"></div>':'');
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".sdot.done"),function(d){
    d.onclick=function(){cur=+d.getAttribute("data-i");renderNav();renderStep();};
  });
}

function renderStep(){
  var s=T.steps[cur];
  document.getElementById("fdisp").innerHTML=fmt(s.formula);
  var h='<div class="sbadge">'+(cur+1)+' / '+T.steps.length+' \uB2E8\uACC4</div><div class="card"><span class="tag '+s.tag+'">'+s.tagTxt+'</span>';
  s.bubbles.forEach(function(b){
    h+='<div class="brow '+(b.r==="s"?"r":"")+'"><div class="av '+b.r+'">'+(b.r==="t"?"T":"S")+'</div><div class="bb '+b.r+'">'+fmt(b.txt)+'</div></div>';
  });
  h+='<hr><div class="ql">'+fmt(s.q)+'</div>'
    +'<div class="clog" id="clog"></div>'
    +'<textarea id="ans" placeholder="\uC5EC\uAE30\uC5D0 \uC790\uC2E0\uC758 \uC0DD\uAC01\uC744 \uC790\uC720\uB86D\uAC8C \uC368\uBCF4\uC138\uC694. \uC774\uC720\uB3C4 \uD568\uAED8 \uC4F0\uBA74 \uC88B\uC544\uC694."></textarea>'
    +'<div class="brow2"><button class="btn bp" id="bsub">\uC81C\uCD9C</button><button class="btn bs" id="bhint">\uD78C\uD2B8 \uC694\uCCAD</button><span class="kbd">Ctrl + Enter \uB85C \uC81C\uCD9C</span></div>'
    +'</div>'
    +'<div class="nrow" id="nrow"><button class="btn bp" id="bnext">'+(cur<T.steps.length-1?"\uB2E4\uC74C \uB2E8\uACC4\uB85C \u2192":"\uC99D\uBA85 \uC644\uC131 \u2014 \uC694\uC57D \uBCF4\uAE30 \u2192")+'</button></div>';
  document.getElementById("main").innerHTML=h;
  document.getElementById("bsub").onclick=submit;
  document.getElementById("bhint").onclick=hint;
  document.getElementById("bnext").onclick=nextStep;
  document.getElementById("ans").addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();submit();}
  });
  renderLog();
  if(state[cur].phase==="done"){
    document.getElementById("nrow").className="nrow show";
    lockInput(true);
  }
}

function renderLog(){
  var el=document.getElementById("clog");
  if(!el)return;
  el.innerHTML=logs[cur].map(function(m){
    var me=m.role==="me";
    return '<div class="cm '+(me?"me":"")+'"><div class="cav '+(me?"me":"ai")+'">'+(me?"\uB098":"T")+'</div><div class="cb '+m.cls+'">'+(me?esc(m.text):fmt(m.text))+'</div></div>';
  }).join("");
}

function addMsg(role,text,cls){
  logs[cur].push({role:role,text:text,cls:cls||(role==="me"?"me":"ai")});
  renderLog();
  var el=document.getElementById("clog");
  if(el&&el.lastChild&&el.lastChild.scrollIntoView)el.lastChild.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function teacherSay(list,cb){
  /* list: [[text,cls],...] shown one by one with short typing delay */
  busy=true;
  var i=0;
  function next(){
    if(i>=list.length){busy=false;if(cb)cb();return;}
    logs[cur].push({role:"ai",text:"\u2026",cls:"typing"});renderLog();
    var item=list[i++];
    setTimeout(function(){
      logs[cur].pop();
      addMsg("ai",item[0],item[1]);
      next();
    },450);
  }
  next();
}

function lockInput(on){
  var ta=document.getElementById("ans"),b1=document.getElementById("bsub"),b2=document.getElementById("bhint");
  if(ta){ta.disabled=on;if(on)ta.placeholder="\uC774 \uB2E8\uACC4 \uC644\uC131! \uB2E4\uC74C \uB2E8\uACC4\uB85C \uB118\uC5B4\uAC00\uC138\uC694.";}
  if(b1)b1.disabled=on;if(b2)b2.disabled=on;
}

function complete(){
  var st=state[cur];
  st.phase="done";
  if(done.indexOf(cur)<0)done.push(cur);
  renderNav();
  document.getElementById("nrow").className="nrow show";
  lockInput(true);
}

      "\uC815\uB2F5\uC744 \uBCF4\uC5EC \uC904\uAC8C\uC694. \uC77D\uC5B4 \uBCF8 \uB4A4, \uC790\uC2E0\uC758 \uB9D0\uB85C \uB2E4\uC2DC \uC368\uC11C \uC81C\uCD9C\uD574 \uBCF4\uC138\uC694.\n"+s.model
    ]);

  var f=s.follow;
  return (f.hints||[f.miss]).concat([
    "\uC815\uB2F5\uC744 \uBCF4\uC5EC \uC904\uAC8C\uC694. \uC77D\uC5B4 \uBCF8 \uB4A4, \uC790\uC2E0\uC758 \uB9D0\uB85C \uB2E4\uC2DC \uC368\uC11C \uC81C\uCD9C\uD574 \uBCF4\uC138\uC694.\n"+f.model
  ]);
}
function shown(text){
  for(var i=0;i<logs[cur].length;i++){if(logs[cur][i].role==="ai"&&logs[cur][i].text.indexOf(text)>=0)return true;}
  return false;
}
function nextHint(s,st){
  /* \uC544\uC9C1 \uBCF4\uC5EC \uC8FC\uC9C0 \uC54A\uC740 \uB2E4\uC74C \uD78C\uD2B8\uB97C \uBC18\uD658 (\uAC19\uC740 \uB9D0 \uBC18\uBCF5 \uAE08\uC9C0) */
  var L=ladder(s,st);
  while(st.hint<L.length){
    var raw=L[st.hint],n=st.hint+1;st.hint++;
    var body=raw.replace(/^\uC791\uC740 \uC9C8\uBB38( \d)?: /,"");
    if(shown(body))continue;
    var label=n<=L.length-2?"\uC791\uC740 \uC9C8\uBB38":(n===L.length?"\uC815\uB2F5 \uACF5\uAC1C":"\uBE48\uCE78 \uCC44\uC6B0\uAE30");
    if(st.phase==="follow")label=n===L.length?"\uC815\uB2F5 \uACF5\uAC1C":"\uC791\uC740 \uC9C8\uBB38";
    return "\uD78C\uD2B8 "+n+"/"+L.length+" \u00B7 "+label+"\n"+body;
  }
  return null;
}

function submit(){
  if(busy)return;
  var ta=document.getElementById("ans");
  var ans=ta.value.trim();
  if(!ans){ta.focus();return;}
  ta.value="";
  addMsg("me",ans);
  var s=T.steps[cur],st=state[cur];
  var a=norm(ans);

  if(/\uBAA8\uB974\uACA0|\uBAA8\uB984|\uBAB0\uB77C|\uC798\uBAA8\uB974|\uD78C\uD2B8/.test(a)){
    var h0=nextHint(s,st);
    teacherSay([["\uAD1C\uCC2E\uC544\uC694. \uBAA8\uB974\uB294 \uAC78 \uC194\uC9C1\uD558\uAC8C \uB9D0\uD558\uB294 \uAC83\uB3C4 GoGAR\uC758 \uC911\uC694\uD55C \uD55C \uC218\uC608\uC694.","ai"],[h0||"\uD78C\uD2B8\uB97C \uBAA8\uB450 \uBD24\uC5B4\uC694. \uC704\uC758 \uC815\uB2F5 \uACF5\uAC1C \uB0B4\uC6A9\uC744 \uC790\uC2E0\uC758 \uB9D0\uB85C \uC815\uB9AC\uD574 \uC81C\uCD9C\uD574 \uBCF4\uC138\uC694.","hint"]]);
    return;
  }
  if(a.length<4){
    teacherSay([["\uC870\uAE08 \uB354 \uC790\uC138\uD788 \uC368 \uBCFC\uB798\uC694? '\uC65C \uADF8\uB807\uAC8C \uC0DD\uAC01\uD558\uB294\uC9C0' \uC774\uC720\uB97C \uD55C \uBB38\uC7A5\uB9CC \uB367\uBD99\uC5EC \uC8FC\uC138\uC694.","partial"]]);
    return;
  }

  /* \uC774 \uB2E8\uACC4(\uBCF8 \uC9C8\uBB38 / \uD6C4\uC18D \uC9C8\uBB38) \uC548\uC5D0\uC11C \uC4F4 \uB2F5\uC744 \uBAA8\uB450 \uBAA8\uC544\uC11C \uCC44\uC810 */
  st.acc+=" "+ans;
  var spec=st.phase==="main"?s.good:s.follow;
  var r=judge(st.acc,spec);

  if(r.lv==="good"){
    st.fail=0;st.last="";
    if(st.phase==="main"){
      st.phase="follow";st.acc="";st.hint=0;
      teacherSay([[(spec.ok),"ok"],["\uD55C \uAC78\uC74C \uB354 \u2014 "+s.follow.q,"ai"]]);
    }else{
      teacherSay([[spec.ok,"ok"],["\uC774 \uB2E8\uACC4 \uC644\uC131! \uC5EC\uB7EC\uBD84\uC774 \uB0B4\uB193\uC740 \uC774\uC720\uAC00 \uB2E4\uC74C \uB2E8\uACC4\uC758 \uCD9C\uBC1C\uC810\uC774 \uB429\uB2C8\uB2E4. \uC544\uB798 \uBC84\uD2BC\uC73C\uB85C \uB118\uC5B4\uAC00\uC138\uC694.","ok"]],complete);
    }
    return;
  }

  st.fail++;
  var msg,cls;
  if(r.lv==="partial"){msg=r.msg;cls="partial";}
  else if(st.phase==="main"){msg=s.miss[(st.fail-1)%s.miss.length];cls="miss";}
  else{msg=s.follow.miss;cls="miss";}

  var out=[];
  if(msg!==st.last&&!shown(msg)){out.push([msg,cls]);st.last=msg;}
  else out.push(["\uC55E\uC5D0\uC11C \uB9D0\uD55C \uB0B4\uC6A9\uC740 \uAE30\uC5B5\uD558\uACE0 \uC788\uC5B4\uC694. \uC544\uC9C1 \uBE60\uC9C4 \uBD80\uBD84\uC774 \uC788\uC5B4\uC11C, \uAC19\uC740 \uC9C8\uBB38\uC744 \uBC18\uBCF5\uD558\uB294 \uB300\uC2E0 \uD78C\uD2B8\uB97C \uD55C \uB2E8\uACC4 \uB354 \uB4DC\uB9B4\uAC8C\uC694.","ai"]);
  /* \uB450 \uBC88\uC9F8 \uC2E4\uD328\uBD80\uD130\uB294 \uB9E4\uBC88 \uD55C \uB2E8\uACC4 \uB354 \uAD6C\uCCB4\uC801\uC778 \uD78C\uD2B8\uB97C \uC790\uB3D9\uC73C\uB85C */
  if(st.fail>=2||out[0][1]==="ai"){
    var h=nextHint(s,st);
    out.push([h||"\uD78C\uD2B8\uB97C \uBAA8\uB450 \uBD24\uC5B4\uC694. \uC704\uC758 \uC815\uB2F5 \uACF5\uAC1C \uB0B4\uC6A9\uC744 \uCC38\uACE0\uD574 \uC790\uC2E0\uC758 \uB9D0\uB85C \uC815\uB9AC\uD574 \uC81C\uCD9C\uD574 \uBCF4\uC138\uC694.","hint"]);
  }
  teacherSay(out);
}

function hint(){
  if(busy)return;
  var s=T.steps[cur],st=state[cur];
  if(st.phase==="done")return;
  var h=nextHint(s,st);
  teacherSay([[h||"\uD78C\uD2B8\uB97C \uBAA8\uB450 \uBD24\uC5B4\uC694. \uC704\uC758 \uC815\uB2F5 \uACF5\uAC1C \uB0B4\uC6A9\uC744 \uCC38\uACE0\uD574 \uC790\uC2E0\uC758 \uB9D0\uB85C \uC815\uB9AC\uD574 \uC81C\uCD9C\uD574 \uBCF4\uC138\uC694.","hint"]]);
}

function nextStep(){
  if(cur<T.steps.length-1){cur++;renderNav();renderStep();window.scrollTo({top:0,behavior:"smooth"});}
  else showSum();
}

function showSum(){
  document.getElementById("fdisp").innerHTML="GoGAR \uC99D\uBA85 \uC644\uC131";
  cur=T.steps.length;renderNav();
  var h='<div class="sum"><h2>\uC6B0\uB9AC\uAC00 \uD568\uAED8 \uC313\uC740 \uC774\uC720\uC758 \uC0AC\uC2AC</h2><div class="ff">'+fmt(T.final)+'</div>';
  T.steps.forEach(function(s){
    h+='<div class="si"><span class="tag '+s.tag+'">'+s.tagTxt.split(" \u2014 ")[0]+'</span><span class="st">'+fmt(s.sum)+'</span></div>';
  });
  h+='<div class="note">'+T.note+'</div><div class="again"><button class="btn bs" id="bagain">\uCC98\uC74C\uBD80\uD130 \uB2E4\uC2DC \uD558\uAE30</button></div></div>';
  document.getElementById("main").innerHTML=h;
  document.getElementById("bagain").onclick=function(){location.reload();};
  window.scrollTo({top:0,behavior:"smooth"});
}

renderNav();renderStep();
</script>
